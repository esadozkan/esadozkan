# KURULUM: Profil reponda .github/workflows/3d-contrib.yml olarak durmali.
# ONEMLI: Repo > Settings > Actions > General > Workflow permissions >
#         "Read and write permissions" secili olmali (grafigi repoya push ediyor).
# Ilk calistirma: Actions > GitHub-Profile-3D-Contrib > Run workflow. Sonra her gece otomatik.
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"    # her gece
  workflow_dispatch:         # elle tetikleme

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3d contribution graph" || echo "degisiklik yok"
          git push

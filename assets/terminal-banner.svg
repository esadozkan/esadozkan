<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Courier New', Courier, monospace">
  <!-- pencere -->
  <rect x="1" y="1" width="798" height="318" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- başlık çubuğu -->
  <path d="M1 13 a12 12 0 0 1 12 -12 h774 a12 12 0 0 1 12 12 v23 h-798 z" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" font-size="13" fill="#8b949e">esad@blueteam: ~</text>

  <!-- maskeler: komutlarin "yazilma" animasyonu -->
  <defs>
    <mask id="t1"><rect x="40" y="56" width="0" height="24" fill="#fff">
      <animate attributeName="width" from="0" to="75" begin="0.5s" dur="0.55s" fill="freeze"/></rect></mask>
    <mask id="t2"><rect x="40" y="112" width="0" height="24" fill="#fff">
      <animate attributeName="width" from="0" to="160" begin="1.7s" dur="0.8s" fill="freeze"/></rect></mask>
    <mask id="t3"><rect x="40" y="168" width="0" height="24" fill="#fff">
      <animate attributeName="width" from="0" to="185" begin="3.2s" dur="0.8s" fill="freeze"/></rect></mask>
  </defs>

  <!-- satir 1 -->
  <text x="24" y="74" font-size="15" fill="#00ff9c">$</text>
  <text x="40" y="74" font-size="15" fill="#e6edf3" mask="url(#t1)">whoami</text>
  <text x="40" y="100" font-size="15" fill="#79c0ff" opacity="0">esad &#183; blue team / dfir &#183; web security
    <animate attributeName="opacity" to="1" begin="1.2s" dur="0.25s" fill="freeze"/></text>

  <!-- satir 2 -->
  <text x="24" y="130" font-size="15" fill="#00ff9c">$</text>
  <text x="40" y="130" font-size="15" fill="#e6edf3" mask="url(#t2)">cat mission.txt</text>
  <text x="40" y="156" font-size="15" fill="#c9d1d9" opacity="0">analyze &#8594; defend &#8594; document &#183; build in public
    <animate attributeName="opacity" to="1" begin="2.6s" dur="0.25s" fill="freeze"/></text>

  <!-- satir 3 -->
  <text x="24" y="186" font-size="15" fill="#00ff9c">$</text>
  <text x="40" y="186" font-size="15" fill="#e6edf3" mask="url(#t3)">./streak --status</text>
  <text x="40" y="212" font-size="15" fill="#3fb950" opacity="0">[ACTIVE] hedef: 240+ g&#252;n &#183; no zero days
    <animate attributeName="opacity" to="1" begin="4.1s" dur="0.25s" fill="freeze"/></text>
  <text x="40" y="238" font-size="14" fill="#8b949e" opacity="0">python &#183; go &#183; wazuh &#183; volatility &#183; burp suite
    <animate attributeName="opacity" to="1" begin="4.4s" dur="0.25s" fill="freeze"/></text>

  <!-- son prompt + yanip sonen imlec -->
  <text x="24" y="278" font-size="15" fill="#00ff9c">$</text>
  <rect x="42" y="264" width="9" height="17" fill="#00ff9c" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" begin="4.8s" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
